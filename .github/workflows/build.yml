# Builds the program from the code in this repository and records a verifiable proof of that.
# The release starts as a draft, so nothing is public until the build has been checked.
name: Build release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"

      - name: Install the tested versions
        run: python -m pip install --disable-pip-version-check -r requirements.txt numpy==2.0.2 pyinstaller==6.22.3

      - name: Build
        run: python empacotar.py

      - name: Record where the zip came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SecretShop.zip

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$env:TAG" dist/SecretShop.zip --draft --verify-tag --title "$env:TAG" --notes "Draft. Not checked yet."
